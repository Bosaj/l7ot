name: 💡 Feature Request
description: Suggest an enhancement or new functionality for the L7OT platform
title: "[FEAT]: "
labels: ["type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make L7OT even more useful for seafood consumers, port workers, or culinary lovers in Morocco? Share it below!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature related to a problem?
      description: A clear description of the pain point or missed opportunity.
      placeholder: E.g., It's hard to know which season is best for buying Sea Bass in Nador...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: Detailed explanation of how this feature should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've thought of.
